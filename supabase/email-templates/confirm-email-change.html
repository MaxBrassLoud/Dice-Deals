<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>E-Mail-Adresse bestätigen</title>
  </head>
  <body style="margin:0;padding:0;background:#0a0e1a;font-family:Arial,sans-serif;color:#f1f5f9;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#0a0e1a;padding:32px 16px;">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background:#111827;border:1px solid #334155;border-radius:18px;overflow:hidden;">
          <tr><td style="padding:34px 32px 12px;text-align:center;">
            <div style="font-size:38px;line-height:1;">✉️</div>
            <h1 style="margin:16px 0 8px;font-size:25px;color:#f8fafc;">E-Mail-Adresse ändern</h1>
            <p style="margin:0;color:#94a3b8;font-size:15px;line-height:1.5;">Bestätige diese Änderung mit dem folgenden Code.</p>
          </td></tr>
          <tr><td style="padding:24px 32px;text-align:center;">
            <p style="margin:0 0 12px;color:#cbd5e1;font-size:14px;">Dein Bestätigungscode</p>
            <div style="padding:17px 12px;border:1px solid #22c55e;border-radius:12px;background:#0c2118;color:#86efac;font-size:32px;font-weight:700;letter-spacing:9px;">{{ .Token }}</div>
            <p style="margin:18px 0 0;color:#94a3b8;font-size:13px;line-height:1.5;">Gib den sechsstelligen Code nur auf einer Dice-Deals-Seite ein. Teile ihn niemals mit anderen.</p>
          </td></tr>
          <tr><td style="padding:18px 32px 30px;border-top:1px solid #334155;text-align:center;color:#64748b;font-size:12px;line-height:1.5;">Wenn du diese Änderung nicht angefordert hast, sichere bitte dein Konto.</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
