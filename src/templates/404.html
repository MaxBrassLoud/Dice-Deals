<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Seite nicht gefunden</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 30% 40%, rgba(59,130,246,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(239,68,68,0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .dice-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
        }
        .dice {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #1a1a2e;
            font-weight: 800;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            animation: diceFloat 3s ease-in-out infinite;
        }
        @keyframes diceFloat {
            0%, 100% { transform: translate(-50%, -50%) translateY(0) rotate(0deg); }
            25% { transform: translate(-50%, -50%) translateY(-8px) rotate(-3deg); }
            75% { transform: translate(-50%, -50%) translateY(4px) rotate(2deg); }
        }

        .dice-shadow {
            width: 80px;
            height: 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            animation: shadowPulse 3s ease-in-out infinite;
        }
        @keyframes shadowPulse {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.3; }
            50% { transform: translateX(-50%) scale(0.8); opacity: 0.15; }
        }

        .error-code {
            font-size: 8rem;
            font-weight: 800;
            letter-spacing: -4px;
            background: linear-gradient(135deg, #3b82f6, #ef4444);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
            margin-bottom: 0.5rem;
            animation: codeReveal 0.8s cubic-bezier(0.34, 1.2, 0.64, 1) both;
        }
        @keyframes codeReveal {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .message {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            animation: fadeUp 0.6s ease 0.2s both;
        }
        .submessage {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            animation: fadeUp 0.6s ease 0.3s both;
        }
        @keyframes fadeUp {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s;
            animation: fadeUp 0.6s ease 0.4s both;
            position: relative;
            overflow: hidden;
        }
        .back-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s;
        }
        .back-btn:hover::after { transform: translateX(100%); }
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59,130,246,0.4);
        }
        .back-btn:active { transform: scale(0.97); }

        .footer-note {
            margin-top: 3rem;
            font-size: 0.75rem;
            color: #475569;
            animation: fadeUp 0.6s ease 0.6s both;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="dice-container">
            <div class="dice">?</div>
            <div class="dice-shadow"></div>
        </div>
        <div class="error-code">404</div>
        <div class="message">Seite nicht gefunden</div>
        <div class="submessage">Diese Seite existiert nicht oder wurde verschoben.</div>
        <a href="/" class="back-btn">Zur Startseite</a>
        <div class="footer-note">Dice Deals Online</div>
    </div>
</body>
</html>
